# ===============================================================
# 部署升级接口（POC 阶段不跑 Docker，本地 uvicorn + npm run dev 即可）
#
# 升级路径：把下面注释掉的服务打开，同时改 .env 里对应的开关：
#   CHECKPOINTER=postgres   长期记忆：MemorySaver -> PostgresSaver
#   TICKET_STORE=postgres   工单：JSON 文件 -> Postgres 表
#   RETRIEVER=pgvector      检索：进程内 -> pgvector 向量库
# 代码侧不需要改，工厂会按这些开关创建对应实现。
# ===============================================================
services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    env_file:
      - ../.env
    environment:
      HOST: 0.0.0.0
      PORT: "5179"
    ports:
      - "5179:5179"
    restart: unless-stopped

