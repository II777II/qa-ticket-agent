# 单后端容器：FastAPI 同时提供 API、SSE 和前端构建产物。
name: qa-ticket-agent

services:
  backend:
    image: qa-ticket-agent:local
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    env_file:
      - path: ../.env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: "5179"
    ports:
      - "5179:5179"
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:5179/health", timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
