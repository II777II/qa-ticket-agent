    <h1>退货寄回注意事项</h1>
    <div class="meta">编号 KB-EC-0022 · 分类 退换与售后 · 版本 v1 · 更新 2026-08-06</div>
    <p class="summary">寄回前请保留包装、配件与赠品，否则可能影响退款金额。</p>
    <h2>操作步骤 / 规则</h2>
    <ol><li>按售后页地址寄回，勿使用到付</li><li>保留快递单号并回填到售后单</li><li>赠品需一并寄回，缺失会按价值扣减</li></ol>
    <h2>常见问题</h2>
    <dl><dt>售后处理需要多久？</dt><dd>一般 1–3 个工作日审核，退款到账时间取决于支付渠道。</dd><dt>这篇「退货寄回注意事项」适用于所有商品吗？</dt><dd>通用规则适用于多数商品，特殊品类以商品页说明为准。</dd></dl>
    <p class="note">本文为演示数据，实际规则以平台正式公告为准。</p>
