    <h1>商家发货规则</h1>
    <div class="meta">编号 KB-EC-0049 · 分类 商家与规则 · 版本 v1 · 更新 2026-09-29</div>
    <p class="summary">商家需在承诺时效内发货，超时可申请催发货或退款。</p>
    <h2>操作步骤 / 规则</h2>
    <ol><li>现货商品需在 48 小时内发货</li><li>预售商品按页面承诺时间执行</li><li>超时未发货可在订单内发起投诉</li></ol>
    <h2>常见问题</h2>
    <dl><dt>商家不发货怎么办？</dt><dd>可先催发货，超时未发货可申请退款或平台介入。</dd><dt>这篇「商家发货规则」适用于所有商品吗？</dt><dd>通用规则适用于多数商品，特殊品类以商品页说明为准。</dd></dl>
    <p class="note">本文为演示数据，实际规则以平台正式公告为准。</p>
