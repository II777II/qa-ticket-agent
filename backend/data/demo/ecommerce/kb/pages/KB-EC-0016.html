    <p class="summary">部分大件商品支持预约配送，普通快递以快递员联系为准。</p>
    <h2>操作步骤 / 规则</h2>
    <ol><li>大件商品下单时可选择配送时段</li><li>普通快递可备注期望时间，不保证满足</li><li>预约后改期请在配送前联系客服</li></ol>
    <h2>常见问题</h2>
    <dl><dt>多久能看到物流单号？</dt><dd>发货后系统会同步物流单号，通常 2 小时内更新。</dd><dt>这篇「可以预约配送时间吗」适用于所有商品吗？</dt><dd>通用规则适用于多数商品，特殊品类以商品页说明为准。</dd></dl>
